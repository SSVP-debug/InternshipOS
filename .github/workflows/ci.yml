name: CI

# Runs on every push and pull request. Zero cost: GitHub Actions is free
# for this project (public repo = unlimited free minutes; private repo =
# 2,000 free minutes/month, and this suite runs in well under a minute).
# No external accounts, secrets, or services required — the RLS suite
# runs against a disposable Postgres service container spun up inside the
# job itself, never a real Supabase project.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Least-privilege: none of these jobs push to the repo, open a PR, or
# comment on anything — read-only checkout is all any of them need.
permissions:
  contents: read

jobs:
  api-tests:
    name: API tests + type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest suite
        run: npm test

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Type-check scripts (tsconfig.scripts.json)
        run: npm run typecheck:scripts

      - name: Type-check test files (tsconfig.tests.json — see its own comment)
        run: npm run typecheck:tests

  web-build:
    name: Frontend build + type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest suite
        run: npm test

      - name: Type-check test files (tsconfig.tests.json — see its own comment)
        run: npm run typecheck:tests

      - name: Build (tsc --noEmit && vite build)
        env:
          # Dummy values — the build only needs these to exist syntactically
          # (import.meta.env access), not to point at a real project. No
          # network call happens at build time.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_API_BASE_URL: http://localhost:3000
        run: npm run build

  rls-tests:
    name: RLS / ownership test suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run full RLS/ownership test suite
        env:
          DB_NAME: internshipos_test
          PSQL_RUN: "psql -h 127.0.0.1 -p 5432 -U postgres"
          PGPASSWORD: postgres
        run: bash tests/run_rls_tests.sh
